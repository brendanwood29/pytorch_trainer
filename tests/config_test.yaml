batch_pbar: True  
num_epochs: 100
run_name: testing
work_dir: ./package_testing
# early_stopping:
#   patience: 5
device: cuda
grad_clip:
  max_norm: 1.0
loss:
  name: mse_loss
model:
  name: test_model
  num_models_to_save: 2
  print_summary: True
  save_last: False
  freeze_modules:
  unfreeze_modules:
  # init:
  #   strict: True
  #   weights: ./test.py
  #   weights_only: True
  kwargs:
    in_feats: 10
    out_feats: 10
optim:
  name: adam
  lr: 0.001
  kwargs:
    weight_decay: 5e-5
